<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oráculo de Calaphae — Sua classe de Black Desert</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --obsidian:#0d0b09; --obsidian-2:#171310; --obsidian-3:#221c17;
  --sand:#c9a668; --sand-bright:#e3c48a; --sand-dim:#8a7449;
  --blood:#a1402e; --blood-bright:#c65540;
  --bone:#ece4d3; --bone-dim:#a89e8c; --ash:#6b6255; --arcane:#4a9b92;
  --line: rgba(201,166,104,0.18);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh;
  background: radial-gradient(ellipse 900px 500px at 50% -10%, #241c15 0%, transparent 60%),
              linear-gradient(180deg, #131009 0%, #0d0b09 55%, #0a0807 100%);
  color:var(--bone); font-family:'Work Sans', sans-serif;
  display:flex; align-items:center; justify-content:center; padding:32px 16px; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:0.05;
  background-image: repeating-linear-gradient(115deg, var(--sand) 0px, transparent 1px, transparent 3px),
                     repeating-linear-gradient(25deg, var(--bone) 0px, transparent 1px, transparent 4px);
  mix-blend-mode:overlay;
}
.stage{ width:100%; max-width:700px; position:relative; z-index:1; }
h1,h2,h3{ font-family:'Cinzel', serif; margin:0; font-weight:600; }
.compass{ display:flex; justify-content:center; margin-bottom:18px; }
.compass svg{ width:88px; height:88px; }
.compass-ring{ animation: spin 60s linear infinite; transform-origin:50% 50%; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .compass-ring{ animation:none; } }
.card{
  background:linear-gradient(180deg, var(--obsidian-2), var(--obsidian-3));
  border:1px solid var(--line); border-radius:2px; padding:40px 36px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02); position:relative;
}
.card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--sand-dim), var(--blood), var(--sand-dim), transparent); opacity:0.7;
}
.eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--sand-dim); margin:0 0 14px; text-align:center; }
.intro h1{ font-size:25px; text-align:center; color:var(--sand-bright); line-height:1.3; }
.intro .sub{ text-align:center; color:var(--bone-dim); font-size:14px; margin:14px auto 0; max-width:500px; line-height:1.65; }
.chips-preview{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:22px 0 8px; }
.chips-preview span{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ash); border:1px solid var(--line); padding:4px 9px; border-radius:2px; }
.disclaimer{ font-size:11.5px; color:var(--ash); text-align:center; margin-top:18px; line-height:1.55; }
.btn-primary{
  display:block; margin:24px auto 0; background:linear-gradient(180deg, var(--blood-bright), var(--blood));
  color:var(--bone); border:none; font-family:'Cinzel', serif; font-weight:600; font-size:14px;
  letter-spacing:0.06em; text-transform:uppercase; padding:14px 34px; border-radius:2px; cursor:pointer;
  transition:transform .15s ease, opacity .15s ease; box-shadow:0 8px 20px -8px rgba(161,64,46,0.6);
}
.btn-primary:hover{ transform:translateY(-1px); }
.btn-primary:focus-visible, .btn-ghost:focus-visible, .opt:focus-visible, .chip:focus-visible{ outline:2px solid var(--sand-bright); outline-offset:3px; }
.btn-ghost{
  display:block; margin:16px auto 0; background:transparent; color:var(--sand-dim); border:1px solid var(--line);
  font-family:'JetBrains Mono', monospace; font-size:12px; padding:10px 20px; border-radius:2px; cursor:pointer;
  transition:border-color .15s ease, color .15s ease;
}
.btn-ghost:hover{ border-color:var(--sand-dim); color:var(--sand-bright); }
.progress-wrap{ margin-bottom:24px; }
.progress-meta{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ash); margin-bottom:8px; gap:10px; }
.progress-meta b{ color:var(--sand); font-weight:500; }
.sec-tag{ color:var(--sand-dim); text-transform:uppercase; letter-spacing:0.1em; }
.progress-track{ height:3px; background:var(--obsidian); border:1px solid var(--line); border-radius:2px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--blood), var(--sand)); transition:width .35s ease; }
.q-text{ font-size:18px; line-height:1.45; color:var(--bone); margin-bottom:8px; font-weight:500; }
.q-hint{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--sand-dim); letter-spacing:0.05em; margin-bottom:6px; line-height:1.5; }
.options{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
.opt{
  text-align:left; background:var(--obsidian); border:1px solid var(--line); color:var(--bone-dim);
  font-family:'Work Sans', sans-serif; font-size:14.5px; line-height:1.45; padding:13px 16px; border-radius:2px;
  cursor:pointer; transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.opt:hover{ border-color:var(--sand-dim); color:var(--bone); background:var(--obsidian-3); }
.opt.sel{ border-color:var(--sand); color:var(--bone); background:rgba(201,166,104,0.12); }
.opt .mark{ font-family:'JetBrains Mono', monospace; color:var(--sand-dim); margin-right:10px; font-size:12px; }
.opt.sel .mark{ color:var(--sand-bright); }
.opt.ign{ border-style:dashed; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.chip{
  background:var(--obsidian); border:1px solid var(--line); color:var(--bone-dim); font-family:'Work Sans', sans-serif;
  font-size:13px; padding:8px 12px; border-radius:2px; cursor:pointer;
}
.chip:hover{ border-color:var(--sand-dim); }
.chip.sel{ border-color:var(--arcane); color:var(--bone); background:rgba(74,155,146,0.2); }
.chip.sel.neg{ border-color:var(--blood-bright); background:rgba(161,64,46,0.22); }
.q-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
.q-footer .btn-ghost, .q-footer .btn-primary{ margin:0; }
.q-footer .btn-primary{ padding:11px 24px; font-size:12.5px; }
.btn-primary[disabled]{ opacity:0.35; cursor:not-allowed; transform:none; }
.verdict-kicker{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--blood-bright); margin-bottom:10px; }
.verdict-box{ border:1px solid var(--sand); border-radius:2px; padding:26px 22px; text-align:center; background:linear-gradient(180deg, rgba(201,166,104,0.1), rgba(161,64,46,0.04)); }
.verdict-class{ font-size:32px; color:var(--sand-bright); line-height:1.15; }
.verdict-path{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--arcane); margin-top:10px; }
.verdict-margin{ font-size:12.5px; color:var(--bone-dim); margin-top:10px; line-height:1.55; }
.section-label{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ash); margin-bottom:14px; }
.divider{ border:none; height:1px; background:linear-gradient(90deg, transparent, var(--line), transparent); margin:24px 0; }
.legend{ display:flex; gap:16px; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ash); margin-bottom:10px; flex-wrap:wrap; }
.legend i{ display:inline-block; width:10px; height:6px; margin-right:5px; border-radius:1px; vertical-align:middle; }
.phase-row{ margin-bottom:11px; }
.phase-name{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--bone-dim); margin-bottom:4px; }
.bar-track{ height:6px; background:var(--obsidian); border:1px solid var(--line); border-radius:1px; overflow:hidden; margin-bottom:3px; }
.bar-fill{ height:100%; }
.bar-fill.you{ background:linear-gradient(90deg, var(--blood), var(--sand)); }
.bar-fill.cls{ background:var(--arcane); opacity:0.85; }
.bar-fill.mid{ background:var(--sand-dim); }
.rank-row{ padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; color:var(--bone-dim); }
.rank-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.rank-row b{ color:var(--sand-bright); font-weight:600; font-family:'Cinzel', serif; }
.rank-row span.pc{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--sand-dim); text-align:right; }
.rank-tiers{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ash); margin-top:3px; }
.gauge{ height:10px; background:var(--obsidian); border:1px solid var(--line); border-radius:5px; position:relative; overflow:hidden; }
.gauge-fill{ position:absolute; top:0; bottom:0; left:0; background:linear-gradient(90deg, var(--blood-bright), var(--sand-bright)); border-radius:5px; }
.gauge.off .gauge-fill{ background:var(--ash); opacity:0.35; }
.gauge-labels{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ash); margin:5px 0 14px; }
.class-card{ border:1px solid var(--sand-dim); background:linear-gradient(180deg, rgba(201,166,104,0.06), transparent); border-radius:2px; padding:18px; }
.class-card p{ color:var(--bone-dim); font-size:13.5px; line-height:1.6; margin:0; }
.path-box{ border:1px solid var(--line); border-radius:2px; padding:16px; margin-top:12px; background:rgba(74,155,146,0.04); }
.path-box .ph{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--arcane); margin-bottom:8px; }
.path-box p{ color:var(--bone-dim); font-size:13.5px; line-height:1.65; margin:4px 0; }
.path-box b{ color:var(--sand-bright); font-weight:600; }
.meta-box{ border:1px solid var(--line); border-radius:2px; padding:16px; margin-top:12px; }
.meta-box .mh{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--sand-dim); margin-bottom:8px; }
.meta-box p{ color:var(--bone-dim); font-size:13px; line-height:1.6; margin:4px 0; }
.meta-box b.hl{ color:var(--sand-bright); }
.callout{ border-left:2px solid var(--blood); padding:4px 0 4px 16px; margin:14px 0; color:var(--bone-dim); font-size:13.5px; line-height:1.65; }
.callout.arcane{ border-left-color:var(--arcane); }
.trow{ margin-bottom:4px; display:block; } .trow .gauge-labels{ margin:3px 0 12px; } .trow-name{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--bone-dim); margin-bottom:5px; display:flex; justify-content:space-between; gap:8px; } .pattern-box{ border:1px solid var(--sand-dim); background:linear-gradient(180deg, rgba(201,166,104,0.06), transparent); border-radius:2px; padding:16px; margin-bottom:16px; } .pattern-box h3{ font-size:17px; color:var(--sand-bright); margin-bottom:6px; } .pattern-box p{ color:var(--bone-dim); font-size:13.5px; line-height:1.6; margin:4px 0; } .stab-big{ font-family:'Cinzel', serif; font-size:22px; color:var(--sand-bright); }
.footer-actions{ display:flex; justify-content:center; margin-top:28px; }
@media (max-width:480px){ .card{ padding:28px 20px; } .intro h1{ font-size:20px; } .verdict-class{ font-size:26px; } }
</style>
</head>

  function pearson(a,b){

        distancia: 1 - Math.abs(rg.mean - c.range)/4,
        elegancia: 1 - Math.abs(el.mean - c.eleg)/4,
        dificultad: Math.max(0, 1 - (Math.max(0,c.diff-L)*0.5 + Math.max(0,L-c.diff)*0.25)),
        equipo: 1 - Math.abs(tm.mean - (c.team-1)*2)/4,
        proteccion: c.prot===null ? 0.5 : 1 - Math.abs(pr.mean - (c.prot-1)*2)/4,
        esquiva: c.eva===null ? 0.5 : 1 - Math.abs(ev.mean - (c.eva-1)*2)/4,
        control: c.cc===null ? 0.5 : 1 - Math.abs(ccI.mean - (c.cc-1)*2)/4,
        movilidad: c.mov===null ? 0.5 : 1 - Math.abs(mv.mean - (c.mov-1)*2)/4,
        agarre: c.grab===null ? 0.5 : 1 - Math.abs(gr.mean - (c.grab-1)*2)/4,
        ritmo: c.spd===null ? 0.5 : 1 - Math.abs(sp.mean - (c.spd-1)*2)/4,
        dano: c.brst===null ? 0.5 : 1 - Math.abs(br.mean - c.brst)/4

      var raw=null;
      if(hasH){
        var sl = liked.length ? mean(liked.map(function(id){ return SIM[c.id][id]; })) : null;

      var meta=null;
      if(Wm>0){ var ms=[]; names.forEach(function(nm){ var m=nameMeta(nm,c,a,contents); if(m!==null) ms.push(m); }); meta = ms.length ? Math.max.apply(null,ms) : 0.5; }

    if(hasH && cands.length){
      var mn=Math.min.apply(null,cands.map(function(x){return x.raw;})), mx=Math.max.apply(null,cands.map(function(x){return x.raw;}));
      cands.forEach(function(x){ x.f.historial = mx>mn ? (x.raw-mn)/(mx-mn) : 0.5; });
    }
    cands.forEach(function(x){
      var parts = [["ciclo de caça",W.ph,x.f.fase],["papel",W.ar,x.f.rol],["distância",W.rng*rg.w,x.f.distancia],["elegância",W.eleg*el.w,x.f.elegancia],["dificuldade",W.cx*cxI.w,x.f.dificultad],["equipe",W.team*tm.w,x.f.equipo],["proteção",W.prot*pr.w,x.f.proteccion],["esquiva",W.eva*ev.w,x.f.esquiva],["control (CC)",W.cc*ccI.w,x.f.control],["mobilidade",W.mov*mv.w,x.f.movilidad],["agarre",W.grab*gr.w,x.f.agarre],["ritmo",W.spd*sp.w,x.f.ritmo],["tipo de daño",W.brst*br.w,x.f.dano]];

  function hashRecords(records){
    var s = JSON.stringify(records), h = 2166136261;

  function mulberry(seed){
    return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };

  function bootstrap(records, filters, N, dropP){
    var rnd = mulberry(hashRecords(records)), freq={}, tot=0;

  }

    h += traitRow("Diante da derrota","Se tilta","Analisa e ajusta",trMean(a,"res"));
    h += traitRow("Equipe","Autônomo","Coordinado", tm.w>0?tm.mean:null);
    h += '<p class="section-label" style="margin-top:6px;">Seu tipo de jogabilidade</p>'+
      '<div class="callout">Papéis que mais te atraem: <b>'+ps.top.join(' + ')+'</b>. Seu ritmo é <b>'+ps.burst+'</b> y <b>'+ps.entry+'</b>.</div>';

    // Estabilidad
    h += '<hr class="divider"><p class="section-label">Estabilidade do resultado</p>'+
         '<p><span class="stab-big">'+stab+'%</span> <span style="color:var(--bone-dim);font-size:13px;"> de 400 variações (removendo ao acaso 1 em cada 5 respostas) continuam dando '+esc(nameTop)+'.</span></p>'+
         '<p style="color:var(--bone-dim);font-size:13px;line-height:1.6;">'+stabText+'</p>';
    h += '<div style="margin-top:8px;">'+byFreq.map(function(id){ return '<div class="rank-row"><div><b>'+esc(nameOf(id))+'</b></div><span>sai em '+Math.round(100*B.freq[id]/B.tot)+'%</span></div>'; }).join('')+'</div>';

    // Ciclo de caza
    h += '<hr class="divider"><p class="section-label">Seu ciclo de caça vs. o de '+esc(nameTop)+'</p>'+
         '<div class="legend"><span><i style="background:var(--sand)"></i>Você</span><span><i style="background:var(--arcane)"></i>'+esc(nameTop)+' (estimativa do teste)</span></div>';
    var mx = Math.max.apply(null, PHASES.map(function(k){ return a.v[k]; })) || 1;
    PHASES.forEach(function(k,i){
      h += '<div class="phase-row"><div class="phase-name">'+PHASE_LABELS[k]+'</div>'+
        '<div class="bar-track"><div class="bar-fill you" style="width:'+Math.max(3,Math.round(a.v[k]/mx*100))+'%"></div></div>'+
        '<div class="bar-track"><div class="bar-fill cls" style="width:'+Math.max(3,Math.round(c.ph[i]/3*100))+'%"></div></div></div>';
    });

    h += '<hr class="divider"><p class="section-label">Seu top 5</p>';
    R.slice(0,5).forEach(function(r,i){ h += '<div class="rank-row"><div>'+(i+1)+'. <b>'+esc(displayName(r))+'</b></div><span>'+pct(r)+'%</span></div>'; });

    h += '<hr class="divider"><p class="section-label">Suas afinidades de papel</p>';
    var amx = Math.max.apply(null, ARCH.map(function(k){ return a.v[k]; })) || 1;
    ARCH.slice().sort(function(x,y){ return a.v[y]-a.v[x]; }).slice(0,6).forEach(function(k,i){
      h += '<div class="phase-row"><div class="phase-name">'+ARCH_LABELS[k]+'</div><div class="bar-track"><div class="bar-fill '+(i<2?'you':'mid')+'" style="width:'+Math.max(3,Math.round(a.v[k]/amx*100))+'%"></div></div></div>';
    });

    var rg=softInfo(a,"rng");
    h += '<hr class="divider">';
    h += gaugeBlock("Distância", rg, "Corpo a corpo","À distância", function(m){ return m<=-1?"Corpo a corpo":(m>=1?"À distância":"Misto"); });
    h += gaugeBlock("Elegância vs. brutalidade", el, "Brutal","Elegante", function(m){ return m<=-1?"Mais brutal":(m>=1?"Mais elegante":"Ponto médio"); });
    var L = 2 + cxI.mean/2;
    h += gaugeBlock("Dificuldade desejada", cxI, "Fácil","Alta", function(m){ return L<=1.5?"Prefere fácil":(L>=2.5?"Aceita dificuldade alta":"Dificuldade média"); });
    var softRow=function(label,lo,hi,key){ var i=softInfo(a,key); return i.w>0 ? traitRow(label,lo,hi,i.mean) : ''; };
    var detail = softRow("Proteção ao atacar","Leve e letal","Protegido","prot")+softRow("Esquiva com invulnerabilidade","Aguentar","Esquivar","eva")+softRow("Controle de multidões (CC)","Sem CC","Central","cc")+softRow("Agarre","Sem agarre","Rápido e central","grab")+softRow("Mobilidade de posicionamento","Terrestre simples","Aérea / teletransporte","mov")+softRow("Ritmo","Lento e pesado","Rápido e ágil","spd")+softRow("Tipo de dano","Sustentado","Burst","brst");
    if(detail) h += '<p class="section-label" style="margin-top:6px;">Seu estilo de combate em detalhe</p>'+detail+'<p class="disclaimer" style="text-align:left;">Só aparecem as dimensões em que deu uma preferência; as que respondeu «tanto faz» não contam.</p>';

    // Historial (anclas)
    if(state.filters.liked.length || state.filters.disliked.length || state.filters.excluded.length){
      h += '<hr class="divider"><p class="section-label">Como usei seu histórico</p><div class="callout arcane">'+
        (state.filters.liked.length?'Jogabilidade que te agradou (usada para se parecer a ela): <b>'+esc(state.filters.liked.join(', '))+'</b>. ':'')+
        (state.filters.disliked.length?'Jogabilidade que não te agradou (usada para se afastar): <b>'+esc(state.filters.disliked.join(', '))+'</b>. ':'')+
        (state.filters.excluded.length?'Descartadas sem mais: <b>'+esc(state.filters.excluded.join(', '))+'</b>. ':'')+
        (state.filters.keepPlayed===false && state.filters.liked.length?'Pediu algo novo, então suas classes atuais não podem sair.':'')+'</div>';
    }

    // Meta
    var mi = a.metaImp>=2 ? "Disse que o meta importa muito: pesa bastante no cálculo." : (a.metaImp===1 ? "Disse que o meta é um desempate: pesa pouco no cálculo." : "Disse que o meta não importa: é mostrado, mas não conta no cálculo.");
    var bestPathNote = '';
    if(c.path==="dual" && a.metaImp>=1){
      var avgs = {S:[],A:[]};
      top.names.forEach(function(nm){ contents.forEach(function(ct){ var t=T[ct]&&T[ct][nm]; if(!t) return; ["S","A"].forEach(function(k){ if(t[k]!==undefined) avgs[k].push(TS[t[k]]); }); }); });
      if(avgs.S.length && avgs.A.length){
        var ms=mean(avgs.S), ma=mean(avgs.A), rec = a.path>=1?"A":(a.path<=-1?"S":null), bestK = ms>ma?"S":(ma>ms?"A":null);
        if(bestK && rec && bestK!==rec) bestPathNote = '<p style="opacity:.85;">Atenção: com seus conteúdos, o caminho com melhor tier é <b>'+PATH_NAMES[bestK]+'</b>, distinto do que seu estilo recomenda (<b>'+PATH_NAMES[rec]+'</b>).</p>';
      }
    }
    h += '<div class="meta-box"><div class="mh">Meta · tier lists de outubro de 2026 · '+esc(contents.map(function(x){return CONTENT_LABELS[x];}).join(', '))+'</div>'+
      top.names.map(function(nm){ return (top.names.length>1?'<p style="margin-top:8px;"><b style="color:var(--sand-bright);">'+esc(nm)+'</b></p>':'')+tierText(nm,c,a,contents); }).join('')+
      bestPathNote+
      '<p style="opacity:.8;">'+mi+' PvE: Garmoth (by Choice, 2/10/2026). PvP: listas fornecidas pelo autor do teste. ★ marca o caminho que recomendo. Para uncapped, o Gearscore pesa mais que o meta.</p></div>';

    var irl = a.irl.n? a.irl.sum/a.irl.n : 0, gm = a.game.n? a.game.sum/a.game.n : 0;
    var risk = gm>irl+0.25 ? "No jogo você se permite ser mais arriscado do que é na vida real: estes mundos podem ser seu espaço para soltar o controle." :
      (gm<irl-0.25 ? "No jogo você é mais cauteloso do que na vida real: talvez o use para praticar o cálculo e a paciência." : "Sua forma de tomar riscos é consistente dentro e fora do jogo.");
    h += '<hr class="divider"><p class="section-label">Espelho: jogo vs. vida real</p><div class="callout">'+risk+'</div>';

    h += '<hr class="divider"><p class="section-label">Despertar, Sucessão e Ascensão</p>'+
      '<div class="callout arcane">A maioria das classes tem <b>Sucessão</b> (sua arma original, aperfeiçoada) e <b>Despertar</b> (arma e kit novos) a partir do nível 56-60. As classes <b>tipo Ascensão</b> (Archer, Scholar, Deadeye, Wukong e Seraph) não têm Sucessão: começam com um set e evoluem para seu kit de Ascensão. <b>Shai</b> é única: usa Talento como árvore de habilidades (as listas de Garmoth a colocam em Ascensão). <b>Agent</b> tem Sucessão desde julho de 2026 e seu Despertar chega no inverno.</div>';

    var hist = saveHistory({t:Date.now(), top:R.slice(0,3).map(displayName), stab:stab});
    if(hist && hist.length>1){
      var tally={}; hist.forEach(function(x){ x.top.forEach(function(n){ tally[n]=(tally[n]||0)+1; }); });
      var tk = Object.keys(tally).sort(function(x,y){ return tally[y]-tally[x]; }).slice(0,5);
      h += '<hr class="divider"><p class="section-label">Seus últimos '+hist.length+' tentativas (salvo só neste navegador)</p>'+
        '<p style="color:var(--bone-dim);font-size:13px;line-height:1.6;">Classes que mais aparecem no seu top 3: '+tk.map(function(n){ return '<b>'+esc(n)+'</b> ('+tally[n]+')'; }).join(' · ')+'. As que se repetem em várias tentativas são seu sinal mais confiável.</p>';
    }

    h += '<p class="disclaimer">Os perfis de fase, papel, distância, elegância, dificuldade e equipe de cada classe são estimativas do autor do teste. A porcentagem é afinidade entre seu perfil e o da classe, não uma probabilidade. A estabilidade mede quanto o resultado depende de respostas isoladas, não se o teste acerta. O padrão de jogo descreve tendências, não é um diagnóstico.</p>';
    h += '<div class="footer-actions"><button class="btn-ghost" id="restart">↺ Repetir o teste</button></div>';
    app.innerHTML = h;
    document.getElementById('restart').onclick = reset;
  }

  function reset(){ state = { idx:0, records:new Array(QUESTIONS.length), filters:freshFilters(), _gi:undefined, _ki:undefined }; renderIntro(); }

  window.__BDO = { QUESTIONS:QUESTIONS, CLASSES:CLASSES, PHASES:PHASES, ARCH:ARCH, T:T, CONFLICT:CONFLICT, TS:TS, aggregate:aggregate, rank:rank, bootstrap:bootstrap,
                   state:function(){ return state; }, setRecords:function(r,f){ state.records=r; state.filters=Object.assign(freshFilters(), f||{}); }, renderResult:renderResult,
                   describePattern:describePattern, describePlaystyle:describePlaystyle, nameMeta:nameMeta, SIM:SIM };
  renderIntro();
})();

</script>
</body>
</html>
